# shellcheck shell=sh
# shellcheck disable=SC2034  # sourced by the other scripts, not run directly
#
# Bluetooth device name, shared by the shell scripts and main.lua.
#
# Must match the remote exactly as bluetoothctl reports it, which is also the
# N: Name="..." entry in /proc/bus/input/devices. Changing it in one place used
# to mean editing three files, and forgetting the quotes in one of them is what
# broke connect.sh.
#
# To switch remotes, leave exactly one line uncommented and restart KOReader.
# The last uncommented line wins, for main.lua as for sh.
BT_DEVICE_NAME="Kobo Remote"
# BT_DEVICE_NAME="Free3-P"  # Hanlinyue Free3: switch on P, Up and Down Mode
