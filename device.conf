# shellcheck shell=sh
# shellcheck disable=SC2034  # sourced by the other scripts, not run directly
#
# The remotes this plugin reads, in order of preference, separated by "|".
# Shared by the shell scripts and main.lua.
#
# Each must match the remote exactly as bluetoothctl reports it, which is also
# the N: Name="..." entry in /proc/bus/input/devices.
#
# Every listed remote that is connected turns pages. Reconnecting tries them
# in this order and stops at the first with a working bond. Edit, then restart
# KOReader. The last uncommented line wins, for main.lua as for sh.
#
#   Free3-P      Hanlinyue Free3: switch on P, Up and Down Mode
#   Kobo Remote  the official Kobo Remote
BT_DEVICE_NAMES="Free3-P|Kobo Remote"
