name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Checked as sh, not bash: the device runs every script under busybox
      # ash, whatever the shebang says. .shellcheckrc lets -x follow the
      # sourced device.conf and lib.sh.
      - run: shellcheck --version
      - run: shellcheck -x -s sh ./*.sh

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4  # v1.2.0
        with:
          args: .
