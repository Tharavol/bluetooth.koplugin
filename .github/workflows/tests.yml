name: Tests

# The transcripts in tests/expected/ against a fake KOReader (tests/lua) and
# a fake Kobo (tests/sh). See tests/run.sh.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # busybox, because the scripts run under busybox ash on the device; the
      # runner puts its applets first on PATH too.
      - run: sudo apt-get update && sudo apt-get install -y luajit busybox
      - run: luajit -v && busybox | head -1
      - run: sh tests/run.sh
